name: Update Delivery Data

on:
  schedule:
    # 12:30 PM UTC is 6:00 PM IST (Mon-Fri)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from iPad anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas jugaad-data requests

      - name: Run Fetcher Script
        run: python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_data.json
          git commit -m "Auto-update market delivery data" || exit 0
          git push
