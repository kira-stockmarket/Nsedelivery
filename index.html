<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timeframe Delivery Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; font-weight: 700; }
        .tab-inactive { color: #64748b; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-end border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Smart Money <span class="text-cyan-400">Terminal V3</span></h1>
                <p class="text-xs text-slate-400 mt-1">Multi-Timeframe Institutional Flow Analysis</p>
            </div>
            
            <!-- Timeframe Tabs -->
            <div class="flex space-x-6 text-sm">
                <button onclick="setTimeframe('daily')" id="tab-daily" class="pb-2 tab-inactive transition">Daily</button>
                <button onclick="setTimeframe('weekly')" id="tab-weekly" class="pb-2 tab-active transition">Weekly (5-Day)</button>
                <button onclick="setTimeframe('monthly')" id="tab-monthly" class="pb-2 tab-inactive transition">Monthly (20-Day)</button>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="bg-slate-950/70 text-slate-400 uppercase border-b border-slate-800">
                        <th class="p-4 cursor-pointer" onclick="handleSort('symbol')">Symbol</th>
                        <th class="p-4 text-right">LTP (₹)</th>
                        <th class="p-4 text-right cursor-pointer" onclick="handleSort('change')">Net Change %</th>
                        <th class="p-4 text-right cursor-pointer" onclick="handleSort('turnover')">Deliv Turnover (Cr)</th>
                        <th class="p-4 w-48 cursor-pointer" onclick="handleSort('deliv')">Avg Delivery %</th>
                        <th class="p-4 text-center">Trend Signal</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-800/60 font-medium"></tbody>
            </table>
        </div>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/kira-stockmarket/Nsedelivery/main/market_data.json';
        let allData = [];
        let timeframe = 'weekly';
        let sortCol = 'turnover';
        let sortDesc = true;

        async function init() {
            try {
                const res = await fetch(DATA_URL);
                allData = await res.json();
                renderTable();
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="p-6 text-center text-rose-400">Run the Python script first to generate timeframe data.</td></tr>`;
            }
        }

        function setTimeframe(tf) {
            timeframe = tf;
            document.querySelectorAll('button[id^="tab-"]').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('tab-inactive');
            });
            document.getElementById(`tab-${tf}`).classList.add('tab-active');
            renderTable();
        }

        function handleSort(col) {
            sortDesc = sortCol === col ? !sortDesc : true;
            sortCol = col;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let sorted = [...allData].sort((a, b) => {
                let vA = sortCol === 'symbol' ? a.symbol : (sortCol === 'ltp' ? a.ltp : a[timeframe][sortCol]);
                let vB = sortCol === 'symbol' ? b.symbol : (sortCol === 'ltp' ? b.ltp : b[timeframe][sortCol]);
                if (vA < vB) return sortDesc ? 1 : -1;
                if (vA > vB) return sortDesc ? -1 : 1;
                return 0;
            });

            sorted.slice(0, 100).forEach(s => {
                const tfData = s[timeframe];
                const isAcc = tfData.change >= 0;
                const isHigh = tfData.deliv >= 50;
                let signal = isAcc && isHigh ? 'Accumulation' : (!isAcc && isHigh ? 'Distribution' : 'Noise');
                let color = isAcc && isHigh ? 'emerald' : (!isAcc && isHigh ? 'rose' : 'slate');

                const row = `
                    <tr class="hover:bg-slate-800/50">
                        <td class="p-4 font-bold text-white tracking-wide">${s.symbol}</td>
                        <td class="p-4 text-right text-slate-200">₹${s.ltp.toFixed(2)}</td>
                        <td class="p-4 text-right text-${isAcc ? 'emerald' : 'rose'}-400">${isAcc ? '+' : ''}${tfData.change.toFixed(2)}%</td>
                        <td class="p-4 text-right text-cyan-200">₹${tfData.turnover.toFixed(1)}</td>
                        <td class="p-4">
                            <div class="flex justify-between mb-1 text-[11px]"><span class="text-white">${tfData.deliv.toFixed(1)}%</span></div>
                            <div class="w-full bg-slate-800 rounded-full h-1.5"><div class="bg-${color}-500 h-1.5 rounded-full" style="width: ${tfData.deliv}%"></div></div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-1 rounded text-[10px] uppercase font-bold bg-${color}-500/10 text-${color}-400">${signal}</span>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }
        init();
    </script>
</body>
</html>
